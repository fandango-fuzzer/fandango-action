name: Fandango fuzz
description: Fuzz the program in your repository with Fandango and Fanbase specs, and read what it finds in the Security tab.
author: José Antonio Zamudio Amaya
branding:
  icon: zap
  color: orange

inputs:
  specs:
    description: The Fanbase specs of your program's input format, separated by spaces (for example "json json-boundary").
    required: true
  run:
    description: >-
      The short way to say how to run your program on one file: a command, with {file} where the input goes
      (for example "python -m myreader {file}"). It is run from the root of the repository, and its exit
      status is the answer: 0 if it accepts the file. With it, no `target-dir` is needed.
    default: ""
  name:
    description: With `run`, what to call your program in the alerts. The default is the repository's name.
    default: ""
  target-dir:
    description: >-
      The folder of your repository that says how to run your program on one file, as NAME/target.yml with a
      harness next to it. Only what is in it is fuzzed: the action is for the program of the repository it runs in.
    default: .fandango/targets
  targets:
    description: >-
      Leave it empty to fuzz every target in `target-dir` that reads the specs' format, or name some of them,
      separated by commas. With two or more (implementations of the format in your repository, say), where
      they disagree is found as well.
    default: ""
  report:
    description: >-
      Where what is found goes. "alerts": code scanning alerts, which people with write access to the
      repository read in its Security tab, and nobody else (the job needs `security-events: write`).
      "record": a file encrypted to the age keys in `recipients`, kept as an artifact of the run. Leave it
      empty for the alerts, or for the record if you give `recipients`.
    default: ""
  category:
    description: The category of the code scanning analysis. Give each job its own if several jobs of a repository use the action.
    default: fandango
  token:
    description: The token that lists the open alerts, so that they are tried again. The job's own token does.
    default: ${{ github.token }}
  note-above:
    description: >-
      A class of rejection that more than this percentage of a spec's inputs get is reported as a note, not
      as a warning: that many is more often a kind of input your program is not meant to read than a bug.
    default: "20"
  max-new-alerts:
    description: The most alerts one run may open. The rest wait for another run.
    default: "10"
  recipients:
    description: >-
      For the record. The age public key(s) the record is encrypted to, one per line (`age1...`). A
      public key is not a secret: put it here, or in a file and use `recipients-file`. Only the private key
      can read the record.
    default: ""
  recipients-file:
    description: A file of your repository with the age public key(s), one per line.
    default: ""
  count:
    description: Inputs to make from each spec.
    default: "200"
  seed:
    description: The random seed. The default is different for every run; the record says which it was.
    default: ${{ github.run_number }}
  budget:
    description: Seconds for Fandango to make the inputs of one spec (0 for no limit).
    default: "300"
  timeout:
    description: Seconds for a parser to answer about one input.
    default: "10"
  memory:
    description: >-
      Megabytes of memory your program may use for one input (enforced on Linux). A JVM asks for more than
      the default before it starts, so raise it for a Java program, or start the JVM with a small heap.
    default: "2048"
  reduce-budget:
    description: Seconds to reduce the input of one finding.
    default: "60"
  fail-on-findings:
    description: >-
      "true" to fail the job when anything is found. In a public repository a failed job says that something
      was found, and nothing more.
    default: "false"
  registry-repository:
    description: The Fanbase registry with the specs and the targets.
    default: fandango-fuzzer/fanbase
  registry-ref:
    description: Its branch, tag or commit.
    default: main
  fanbase:
    description: The fanbase package to install, as a pip requirement.
    default: fanbase>=0.7
  fandango:
    description: The Fandango package to install, as a pip requirement.
    default: fandango-fuzzer
  python-version:
    description: The Python that runs Fandango, fanbase, and your Python targets.
    default: "3.12"
  setup-python:
    description: >-
      "false" if you set up Python yourself before this step (for instance to install your parser into it);
      then the Python on the PATH is used.
    default: "true"
  artifact-name:
    description: The name of the artifact that holds the encrypted record.
    default: fandango-record
  retention-days:
    description: Days to keep that artifact.
    default: "30"

outputs:
  findings:
    description: How many kinds of finding there were (disagreements and rejected valid inputs; crashes are not counted here).
    value: ${{ steps.fuzz.outputs.findings }}
  record:
    description: The path of the encrypted record on the runner (when the report is a record).
    value: ${{ steps.fuzz.outputs.record }}
  sarif:
    description: The path of the SARIF file with the alerts on the runner (when the report is alerts).
    value: ${{ steps.fuzz.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      if: ${{ inputs.setup-python == 'true' }}
      with:
        python-version: ${{ inputs.python-version }}

    - name: Check out the Fanbase registry
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: ${{ inputs.registry-repository }}
        ref: ${{ inputs.registry-ref }}
        path: .fandango-registry
        persist-credentials: false

    - name: Install age, Fandango and fanbase
      shell: bash
      env:
        FANBASE: ${{ inputs.fanbase }}
        FANDANGO: ${{ inputs.fandango }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Fuzz
      id: fuzz
      shell: bash
      env:
        FUZZ_REGISTRY: .fandango-registry
        FUZZ_SPECS: ${{ inputs.specs }}
        FUZZ_TARGETS: ${{ inputs.targets }}
        FUZZ_RUN: ${{ inputs.run }}
        FUZZ_NAME: ${{ inputs.name }}
        FUZZ_NOTE_ABOVE: ${{ inputs.note-above }}
        FUZZ_MAX_NEW: ${{ inputs.max-new-alerts }}
        FUZZ_TARGET_DIR: ${{ inputs.target-dir }}
        FUZZ_REPORT: ${{ inputs.report }}
        GH_TOKEN: ${{ inputs.token }}
        FUZZ_RECIPIENTS: ${{ inputs.recipients }}
        FUZZ_RECIPIENTS_FILE: ${{ inputs.recipients-file }}
        FUZZ_COUNT: ${{ inputs.count }}
        FUZZ_SEED: ${{ inputs.seed }}
        FUZZ_BUDGET: ${{ inputs.budget }}
        FUZZ_TIMEOUT: ${{ inputs.timeout }}
        FUZZ_MEMORY: ${{ inputs.memory }}
        FUZZ_REDUCE_BUDGET: ${{ inputs.reduce-budget }}
        FUZZ_FAIL: ${{ inputs.fail-on-findings }}
        FUZZ_OUT: ${{ runner.temp }}/fandango
      run: bash "$GITHUB_ACTION_PATH/scripts/fuzz.sh"

    - name: Report what was found as code scanning alerts
      if: ${{ !cancelled() && steps.fuzz.outputs.sarif != '' }}
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
      with:
        sarif_file: ${{ steps.fuzz.outputs.sarif }}
        category: ${{ inputs.category }}

    - name: Keep the encrypted record
      if: ${{ !cancelled() && steps.fuzz.outputs.record != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.fuzz.outputs.record }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
