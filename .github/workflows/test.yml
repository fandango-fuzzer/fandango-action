# The action, tried the way a project uses it: on the program in its own repository. Here that is example/,
# a small JSON reader with two bugs in it on purpose (it crashes on deep nesting, and refuses numbers with an
# exponent). The run gets a key of its own, and the check is that the record holds both bugs while the log
# holds counts only.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: A key for this run only
        id: key
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age > /dev/null
          age-keygen -o "$RUNNER_TEMP/key.txt" 2> /dev/null
          echo "public=$(age-keygen -y "$RUNNER_TEMP/key.txt")" >> "$GITHUB_OUTPUT"

      - name: Fuzz the example project
        id: fuzz
        uses: ./
        with:
          specs: json
          target-dir: example/.fandango/targets
          recipients: ${{ steps.key.outputs.public }}
          count: "60"
          seed: "1"
          reduce-budget: "20"

      - name: The record holds both bugs, and the log only counts
        env:
          RECORD: ${{ steps.fuzz.outputs.record }}
          FINDINGS: ${{ steps.fuzz.outputs.findings }}
        run: |
          set -euo pipefail
          fanbase incidents open "$RECORD" --identity "$RUNNER_TEMP/key.txt" --into "$RUNNER_TEMP/opened"
          python - "$RUNNER_TEMP/opened" "$FINDINGS" <<'PY'
          import json, pathlib, sys
          opened = pathlib.Path(sys.argv[1])
          manifest = json.loads((opened / "manifest.json").read_text())
          crashes = [i for i in manifest["incidents"] if i["target"] == "jsonish" and i["kind"] == "crash"]
          assert crashes, manifest["incidents"]  # the deep nesting
          rejected = [f for f in manifest["findings"] if f["kind"] == "rejected"]
          assert rejected, manifest["findings"]  # the numbers with an exponent
          reduced = (opened / "findings" / rejected[0]["id"] / "reduced.json").read_bytes()
          assert b"e" in reduced.lower() and len(reduced) <= 8, reduced
          assert int(sys.argv[2]) == sum(manifest["finding_kinds"].values())
          print(f"found: {len(crashes)} crash(es); rejected valid input, reduced to {reduced!r}")
          PY
          if grep -E "SIGSEGV|killed by|exponent|Traceback" "$RUNNER_TEMP/fandango/counts.md"; then
            echo "::error::the public counts say more than counts"
            exit 1
          fi

  # The other way to report: code scanning alerts. The steps of the action are run by hand here, without the
  # upload, so that the example's bugs (there on purpose) do not become alerts of this repository. The check
  # is that both bugs are alerts, that the log only counts, and that an alert stays open while its input is
  # still not accepted, even in a run that does not find the bug again.
  alerts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fandango-fuzzer/fanbase
          path: .fandango-registry
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        env:
          FANBASE: fanbase>=0.7
          FANDANGO: fandango-fuzzer
        run: bash scripts/install.sh

      - name: Fuzz the example project, with no key
        env:
          FUZZ_REGISTRY: .fandango-registry
          FUZZ_SPECS: json
          FUZZ_TARGET_DIR: example/.fandango/targets
          FUZZ_COUNT: "60"
          FUZZ_SEED: "1"
          FUZZ_REDUCE_BUDGET: "20"
          FUZZ_OUT: ${{ runner.temp }}/fandango
        run: bash scripts/fuzz.sh 2>&1 | tee "$RUNNER_TEMP/log.txt"

      - name: Both bugs are alerts, the log only counts, and an open alert is tried again
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fandango"
          if grep -E "SIGSEGV|SIGTERM|killed by|exponent|Traceback" "$RUNNER_TEMP/log.txt"; then
            echo "::error::the public log says more than counts"
            exit 1
          fi
          python - "$out" <<'PY'
          import json, pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          results = json.loads((out / "fandango.sarif").read_text())["runs"][0]["results"]
          kinds = sorted(r["ruleId"].split("/")[0] for r in results)
          assert kinds == ["crash", "rejected"], kinds
          rejected = next(r for r in results if r["ruleId"].startswith("rejected/"))
          # which number the input is reduced to changes from run to run: it has an exponent, and it is small
          import base64
          kept = json.loads(rejected["message"]["text"].rsplit("fandango-alert: ", 1)[1])["input"]
          reduced = base64.b64decode(kept)
          assert b"e" in reduced.lower() and len(reduced) <= 8, reduced
          # the alert says how to see the bug again, and doing as it says shows it
          text = rejected["message"]["text"]
          steps = text[text.index("To reproduce"):text.index("fandango-alert: ")].strip().splitlines()[2:]
          assert len(steps) == 2 and steps[0].startswith("echo ") and "harness.py input.json" in steps[1], steps
          seen = subprocess.run("\n".join(steps), shell=True, capture_output=True, text=True)
          assert seen.returncode != 0 and "exponent" in seen.stderr, (seen.returncode, seen.stderr)
          assert rejected["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] \
              == "example/.fandango/targets/jsonish/target.yml"
          # What the code scanning API would list as open, and a run that found nothing new
          alerts = [{"rule": {"id": r["ruleId"]}, "most_recent_instance": {"message": r["message"]}} for r in results]
          (out / "open.jsonl").write_text("\n".join(json.dumps(a) for a in alerts))
          (out / "nothing").mkdir()
          said = subprocess.run([sys.executable, "scripts/alerts.py", str(out / "nothing"), "example/.fandango/targets",
                                 str(out / "again.sarif"), "--open", str(out / "open.jsonl")],
                                capture_output=True, text=True, check=True).stdout
          again = json.loads((out / "again.sarif").read_text())["runs"][0]["results"]
          same = lambda rs: sorted((r["ruleId"], r["partialFingerprints"]["fandangoFinding/v1"]) for r in rs)
          assert same(again) == same(results), (said, same(again))
          assert "2 still open from before" in said, said
          print("both bugs are alerts, and both stay open:", said.strip())
          PY

      - name: The short way, a command in the workflow, finds the same two bugs
        env:
          FUZZ_REGISTRY: .fandango-registry
          FUZZ_SPECS: json
          FUZZ_RUN: python example/.fandango/targets/jsonish/harness.py {file}
          FUZZ_NAME: jsonish
          FUZZ_COUNT: "60"
          FUZZ_SEED: "1"
          FUZZ_REDUCE_BUDGET: "20"
          FUZZ_OUT: ${{ runner.temp }}/fandango-run
        run: |
          set -euo pipefail
          bash scripts/fuzz.sh
          python - "$RUNNER_TEMP/fandango-run/fandango.sarif" <<'PY'
          import json, sys
          results = json.load(open(sys.argv[1]))["runs"][0]["results"]
          kinds = sorted(r["ruleId"].split("/")[0] for r in results)
          assert kinds == ["crash", "rejected"], kinds  # a program that a signal killed is still a crash
          print("the same two bugs, with no target folder")
          PY
